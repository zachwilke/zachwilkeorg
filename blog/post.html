<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog — Zach Wilke</title>
<meta name="description" content="A post by Zach Wilke.">

<link rel="alternate" type="text/markdown" href="/llms.txt" title="Plain-text version for LLMs and agents">

<meta property="og:type" content="article">
<meta property="og:title" content="Blog — Zach Wilke">
<meta property="og:description" content="A post by Zach Wilke.">
<meta property="og:url" content="https://zachwilke.org/blog/">

<meta name="twitter:creator" content="@zachwilke_1">

<style>
  :root {
    --bg: #fdfcf9;
    --text: #1a1f1c;
    --muted: #5c6660;
    --accent: #2c7a4b;
    --accent-hover: #1e5e37;
    --rule: #e3e0d8;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131715;
      --text: #e6e4dd;
      --muted: #96a09a;
      --accent: #5fbf85;
      --accent-hover: #82d4a3;
      --rule: #2a312d;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font: 1.0625rem/1.65 var(--sans);
    max-width: 38rem;
    margin: 0 auto;
    padding: clamp(3rem, 12vh, 6rem) 1.5rem 6rem;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  h1 {
    font-family: var(--serif);
    font-size: clamp(2rem, 7vw, 2.5rem);
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  h1::after {
    content: "";
    display: block;
    width: 2.25rem;
    height: 3px;
    margin-top: 1.1rem;
    background: var(--accent);
    border-radius: 2px;
  }

  p { margin: 0.9rem 0; text-wrap: pretty; }
  .lede { margin-top: 1.4rem; color: var(--muted); }

  .site-nav {
    margin-bottom: 1.4rem;
    font-size: 0.875rem;
  }
  .site-nav a { color: var(--muted); text-decoration: none; }
  .site-nav a:hover { color: var(--accent-hover); }

  a {
    color: inherit;
    text-decoration: underline;
    text-decoration-color: color-mix(in srgb, var(--accent) 45%, transparent);
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    transition: color 0.15s ease, text-decoration-color 0.15s ease;
  }
  a:hover {
    color: var(--accent-hover);
    text-decoration-color: currentColor;
  }
  a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  .prose h2, .prose h3, .prose h4 {
    font-family: var(--serif);
    font-weight: 500;
    letter-spacing: -0.015em;
    line-height: 1.25;
    margin: 2rem 0 0.6rem;
  }
  .prose h2 { font-size: 1.35rem; }
  .prose h3 { font-size: 1.15rem; }
  .prose h4 { font-size: 1.05rem; }
  .prose ul, .prose ol { margin: 0.9rem 0 0.9rem 1.25rem; }
  .prose li { margin: 0.35rem 0; }
  .prose pre {
    overflow-x: auto;
    padding: 0.85rem 1rem;
    margin: 1.1rem 0;
    background: color-mix(in srgb, var(--rule) 70%, transparent);
    border-radius: 4px;
    font-size: 0.9rem;
    line-height: 1.5;
  }
  .prose code { font-size: 0.9em; }
  .prose :not(pre) > code {
    padding: 0.1em 0.35em;
    background: color-mix(in srgb, var(--rule) 80%, transparent);
    border-radius: 3px;
  }
  .prose blockquote {
    margin: 1.1rem 0;
    padding-left: 1rem;
    border-left: 3px solid var(--accent);
    color: var(--muted);
  }
  .prose img { max-width: 100%; height: auto; }
  .prose hr {
    border: 0;
    border-top: 1px solid var(--rule);
    margin: 2rem 0;
  }
  .empty { margin-top: 2rem; color: var(--muted); }

  ::selection { background: color-mix(in srgb, var(--accent) 25%, transparent); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <nav class="site-nav" aria-label="On this site">
    <a href="/blog/">Blog</a>
  </nav>
  <h1 id="title">Blog</h1>
  <p class="lede" id="byline" hidden><time id="date"></time></p>
</header>

<main>
  <noscript><p class="empty">This blog renders markdown in your browser. Enable JavaScript to read posts.</p></noscript>
  <article id="content" class="prose"></article>
</main>

<script src="/vendor/markdown.js"></script>
<script>
(function () {
  var CANONICAL = "https://zachwilke.org";

  function slugFromLocation() {
    var params = new URLSearchParams(location.search);
    if (params.get("p")) return params.get("p");
    var parts = location.pathname.replace(/\/+$/, "").split("/");
    var last = parts[parts.length - 1] || "";
    if (last && last !== "blog" && last !== "post.html" && last !== "index.html") {
      return decodeURIComponent(last);
    }
    return "";
  }

  function formatDate(iso) {
    var d = new Date(iso + "T00:00:00Z");
    if (isNaN(d.getTime())) return iso || "";
    return d.toLocaleDateString("en-US", {
      year: "numeric",
      month: "short",
      day: "numeric",
      timeZone: "UTC"
    });
  }

  function setMeta(selector, attr, value) {
    var node = document.querySelector(selector);
    if (node) node.setAttribute(attr, value);
  }

  async function render() {
    var slug = slugFromLocation();
    var content = document.getElementById("content");
    if (!slug || /[^a-z0-9-]/i.test(slug)) {
      document.title = "Not found — Zach Wilke";
      content.innerHTML = '<p class="empty">Post not found. <a href="/blog/">Back to the blog</a>.</p>';
      return;
    }

    var res = await fetch("/posts/" + encodeURIComponent(slug) + ".md");
    if (!res.ok) {
      document.title = "Not found — Zach Wilke";
      content.innerHTML = '<p class="empty">Post not found. <a href="/blog/">Back to the blog</a>.</p>';
      return;
    }

    var parsed = parseFrontMatter(await res.text());
    var title = parsed.meta.title || slug;
    var date = parsed.meta.date || "";
    var summary = parsed.meta.summary || "";
    var path = "/blog/post.html?p=" + encodeURIComponent(slug);
    var url = CANONICAL + path;

    document.getElementById("title").textContent = title;
    document.title = title + " — Zach Wilke";
    setMeta('link[rel="canonical"]', "href", url);
    setMeta('meta[property="og:title"]', "content", title + " — Zach Wilke");
    setMeta('meta[property="og:url"]', "content", url);
    setMeta('meta[name="description"]', "content", summary || title);
    setMeta('meta[property="og:description"]', "content", summary || title);

    if (date) {
      var time = document.getElementById("date");
      var byline = document.getElementById("byline");
      time.dateTime = date;
      time.textContent = formatDate(date);
      byline.hidden = false;
    }

    content.innerHTML = renderMarkdown(parsed.body);
  }

  render();
})();
</script>

</body>
</html>
