    <article id="content" class="prose"></article>
  </main>

<script src="/vendor/markdown.js"></script>
<script>
(function () {
  var CANONICAL = "https://zachwilke.org";

  function slugFromLocation() {
    var params = new URLSearchParams(location.search);
    if (params.get("p")) return params.get("p");
    var parts = location.pathname.replace(/\/+$/, "").split("/");
    var last = parts[parts.length - 1] || "";
    if (last && last !== "blog" && last !== "post.html" && last !== "index.html") {
      return decodeURIComponent(last);
    }
    return "";
  }

  function formatDate(iso) {
    var d = new Date(iso + "T00:00:00Z");
    if (isNaN(d.getTime())) return iso || "";
    return d.toLocaleDateString("en-US", {
      year: "numeric",
      month: "short",
      day: "numeric",
      timeZone: "UTC"
    });
  }

  function setMeta(selector, attr, value) {
    var node = document.querySelector(selector);
    if (node) node.setAttribute(attr, value);
  }

  async function render() {
    var slug = slugFromLocation();
    var content = document.getElementById("content");
    if (!slug || /[^a-z0-9-]/i.test(slug)) {
      document.title = "Not found — Zach Wilke";
      content.innerHTML = '<p class="empty">Post not found. <a href="/blog/">Back to the blog</a>.</p>';
      return;
    }

    var res = await fetch("/posts/" + encodeURIComponent(slug) + ".md");
    if (!res.ok) {
      document.title = "Not found — Zach Wilke";
      content.innerHTML = '<p class="empty">Post not found. <a href="/blog/">Back to the blog</a>.</p>';
      return;
    }

    var parsed = parseFrontMatter(await res.text());
    var title = parsed.meta.title || slug;
    var date = parsed.meta.date || "";
    var summary = parsed.meta.summary || "";
    var path = "/blog/post.html?p=" + encodeURIComponent(slug);
    var url = CANONICAL + path;

    document.getElementById("title").textContent = title;
    document.title = title + " — Zach Wilke";
    setMeta('link[rel="canonical"]', "href", url);
    setMeta('meta[property="og:title"]', "content", title + " — Zach Wilke");
    setMeta('meta[property="og:url"]', "content", url);
    setMeta('meta[name="description"]', "content", summary || title);
    setMeta('meta[property="og:description"]', "content", summary || title);

    if (date) {
      var time = document.getElementById("date");
      var byline = document.getElementById("byline");
      time.dateTime = date;
      time.textContent = formatDate(date);
      byline.hidden = false;
    }

    content.innerHTML = renderMarkdown(parsed.body);
  }

  render();
})();
</script>

</body>
